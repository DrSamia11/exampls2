<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة الموظف التفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }

        /* A4 Page Styling */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; }
            .no-print { display: none; }
        }

        .card-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Control Panel (No Print) -->
    <div class="no-print max-w-2xl mx-auto mb-8 bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">تعديل بيانات البطاقة</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">اسم الموظف</label>
                <input type="text" id="inputName" oninput="updateCard()" placeholder="أدخل الاسم" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">جهة العمل</label>
                <input type="text" id="inputWork" oninput="updateCard()" placeholder="أدخل جهة العمل" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">سنوات الخدمة</label>
                <input type="number" id="inputYears" oninput="updateCard()" placeholder="0" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
            </div>
        </div>
        <button onclick="window.print()" class="mt-6 w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
            طباعة البطاقة (A4)
        </button>
    </div>

    <!-- A4 Document -->
    <div class="page">
        <!-- Header Decor -->
        <div class="w-full text-center mb-12">
            <h1 class="text-3xl font-bold text-gray-800">بطاقة التعريف الوظيفية</h1>
            <p class="text-gray-500 mt-2">وثيقة رسمية معتمدة</p>
        </div>

        <!-- The Card -->
        <div class="relative w-full max-w-md h-64 card-gradient rounded-3xl p-1 shadow-2xl overflow-hidden transform transition duration-500 hover:scale-105">
            <!-- Decorative circles -->
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white opacity-10 rounded-full"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>

            <div class="h-full w-full glass-effect rounded-[1.4rem] p-8 flex flex-col justify-between border border-white/20">
                <!-- Top Section -->
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs text-blue-600 font-bold uppercase tracking-wider mb-1">بيانات الموظف</p>
                        <h3 id="cardName" class="text-2xl font-bold text-gray-800">اسم الموظف هنا</h3>
                    </div>
                    <div class="bg-blue-100 p-2 rounded-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                </div>

                <!-- Details Section -->
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-
